# Developer CLI only (ADR-040): the backend applies migrations itself at startup and never reads
# this file. Create a revision against a scratch database at head:
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate --rev-id 0002 -m "short description"
[alembic]
script_location = src/assistant_prof/persistence/migrations
file_template = r%%(rev)s_%%(slug)s
prepend_sys_path = src
sqlalchemy.url = sqlite:///build/alembic-dev.sqlite

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
